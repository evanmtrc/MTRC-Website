<g transform="translate(245 255) rotate(10)"><rect x="-55" y="-78" width="110" height="156" rx="10" fill="#fff"/><path d="M0 -40 c-40 30 -40 60 -10 56 c-2 10 -6 18 -12 22 h44 c-6 -4 -10 -12 -12 -22 c30 4 30 -26 -10 -56z" fill="#15281D"/><text x="-40" y="-50" font-family="Georgia" font-size="26" fill="#15281D">K</text></g>
<g transform="translate(440 300)"><rect x="-90" y="-10" width="180" height="20" rx="6" fill="#555"/><path d="M-80 -10 a80 50 0 0 1 160 0" fill="#333"/><path d="M-60 10 L-80 90 M60 10 L80 90" stroke="#555" stroke-width="8"/><g stroke="#B08D57" stroke-width="3" fill="none" opacity=".8"><path d="M-40 -60 q-10 -20 0 -40"/><path d="M0 -60 q-10 -20 0 -40"/><path d="M40 -60 q-10 -20 0 -40"/></g></g>
