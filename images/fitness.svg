<g transform="translate(420 300)"><circle r="42" fill="none" stroke="#15281D" stroke-width="8"/><path d="M0 0 L60 -80 L100 -80 M60 -80 L40 -110 M40 -110 H70 M0 0 L40 -40 H90 M90 -40 L100 -80" stroke="#15281D" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="110" cy="0" r="42" fill="none" stroke="#15281D" stroke-width="8"/></g>
<g transform="translate(120 360)"><g class="bob"><path d="M-22 -30 a22 22 0 1 1 44 0" fill="none" stroke="#15281D" stroke-width="9"/><circle cy="0" r="30" fill="#15281D"/></g></g>
</svg>