<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" role="img" aria-label="Illustration of the clubhouse below Mt. Tamalpais"><style>
@media (prefers-reduced-motion: no-preference){
.bob{animation:bob 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.sway{animation:sway 5s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}
.steam{animation:steam 3.2s ease-in-out infinite;opacity:0}
.steam.d2{animation-delay:1s}.steam.d3{animation-delay:2s}
.twinkle{animation:tw 2.6s ease-in-out infinite}
.twinkle:nth-of-type(2n){animation-delay:.8s}.twinkle:nth-of-type(3n){animation-delay:1.6s}
.wave{animation:wave 6s linear infinite}
.bx{animation:bx 3.2s ease-in-out infinite alternate}
.by{animation:by .8s cubic-bezier(.5,0,.5,1) infinite alternate}
.toss{animation:toss 2.4s ease-in-out infinite}
.drift{animation:drift 9s ease-in-out infinite alternate}
.spin{animation:spin 30s linear infinite;transform-box:fill-box;transform-origin:center}
}
@keyframes bob{50%{transform:translateY(-8px)}}
@keyframes sway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
@keyframes steam{0%{opacity:0;transform:translateY(12px)}35%{opacity:.9}100%{opacity:0;transform:translateY(-26px)}}
@keyframes tw{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes wave{to{transform:translateX(-60px)}}
@keyframes bx{from{transform:translateX(-120px)}to{transform:translateX(90px)}}
@keyframes by{from{transform:translateY(-40px)}to{transform:translateY(20px)}}
@keyframes toss{0%,100%{transform:translateY(0)}50%{transform:translateY(-34px)}}
@keyframes drift{to{transform:translateX(40px)}}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
<rect width="600" height="420" fill="#EEF0EA"/>
<g class="drift" fill="#fff" opacity=".9"><ellipse cx="120" cy="80" rx="46" ry="18"/><ellipse cx="150" cy="70" rx="34" ry="16"/></g><path d="M0 260 L120 150 200 210 320 90 440 220 520 160 600 230 V420 H0Z" fill="#3F6149"/>
<path d="M0 300 L150 230 300 280 450 220 600 290 V420 H0Z" fill="#23402F"/>
<rect x="160" y="250" width="280" height="110" fill="#FBF8F2"/><path d="M140 255 L300 190 460 255Z" fill="#5A3E2B"/>
<rect x="280" y="300" width="40" height="60" fill="#23402F"/><rect x="190" y="280" width="44" height="34" fill="#EEF0EA" stroke="#23402F" stroke-width="3"/><rect x="366" y="280" width="44" height="34" fill="#EEF0EA" stroke="#23402F" stroke-width="3"/>
<rect x="0" y="360" width="600" height="60" fill="#15281D"/>
<text x="300" y="242" text-anchor="middle" font-family="Georgia" font-weight="700" font-size="22" fill="#fff">EST. 1974</text>
</svg>